min_version = "2026.11.1"

# Automatically loaded on macOS via miserc.toml.

[env]
# Native brew packages have no mise shims.
_.path = ["/opt/homebrew/bin", "/opt/homebrew/sbin"]

[bootstrap.packages]
# Brew providers skip explicit version pins; keep current releases here.
# CLI tools are formulae; Colima pulls in Lima as a dependency.
"brew:colima" = "latest"
"brew:docker" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-compose" = "latest"
"brew-cask:kitty" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:font-geist-mono-nerd-font" = "latest"

[tasks."global:setup"]
description = "Install global tools, macOS packages and Docker CLI plugin links"
dir = "{{xdg_config_home}}/mise"
run = [
  "mise install --locked",
  "mise bootstrap packages apply",
  '''
# Stable opt paths keep the plugins linked across package upgrades.
set -eu
mkdir -p "$HOME/.docker/cli-plugins"
for plugin in buildx compose; do
  package_root="$(mise bootstrap packages where "brew:docker-$plugin")"
  test -x "$package_root/bin/docker-$plugin"
  ln -sfn "$package_root/bin/docker-$plugin" "$HOME/.docker/cli-plugins/docker-$plugin"
done
''',
]

[tasks."global:update"]
description = "Upgrade global tools and macOS packages, then refresh plugin links"
dir = "{{xdg_config_home}}/mise"
run = [
  "mise upgrade --global --bump --pin",
  "mise lock --global",
  "mise bootstrap packages upgrade",
  "mise run global:setup",
]
