[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox"]

[tools]
"aqua:dandavison/delta" = "0.19.2"
"aqua:atuinsh/atuin" = "18.20.1"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:jesseduffield/lazygit" = "0.64.1"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"rust" = "1.98.0"
"cargo:eza" = { version = "0.23.5", depends = ["rust"] }
"aqua:sharkdp/fd" = "10.5.0"
"aqua:junegunn/fzf" = "0.74.3"
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"go" = "1.27.0"
"aqua:golangci/golangci-lint" = "2.13.2"
"go:golang.org/x/tools/gopls" = { version = "0.23.0", depends = ["go"] }
"go:golang.org/x/tools/cmd/goimports" = { version = "0.49.0", depends = ["go"] }
"aqua:mvdan/gofumpt" = "0.11.0"
"aqua:gotestyourself/gotestsum" = "1.13.0"
"python" = "3.14.7"
"aqua:starship/starship" = "1.26.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:charmbracelet/glow" = "3.0.0"
"aqua:ClementTsang/bottom" = "0.14.9"
"aqua:sxyazi/yazi" = "26.8.15"
"aqua:cli/cli" = "2.98.0"
"gitlab:gitlab-org/cli" = "1.115.0"
"aqua:neovim/neovim" = "0.12.5"
# Required by nvim-treesitter's main branch to compile parsers — and it must
# not be the npm build (see docs/nvim.md). This aqua entry is a static binary.
"aqua:tree-sitter/tree-sitter" = "0.26.13"

# --- Language servers, linters and formatters used by Neovim ------------------
# Neovim never installs these (no mason.nvim) — it only configures clients
# against whatever is on $PATH. See docs/nvim.md#lsp.

# Static single-file binaries, same class as everything above.
"aqua:LuaLS/lua-language-server" = "3.19.1"   # editing this very config
"aqua:rust-lang/rust-analyzer" = "2026-08-24"
"aqua:astral-sh/ruff" = "0.16.5"              # Python: lint + format + `ruff server`
"aqua:mrjosh/helm-ls" = "0.5.4"
"aqua:helm/helm" = "4.2.4"                    # helm-ls shells out for `helm lint`
"aqua:hadolint/hadolint" = "2.15.1"           # Dockerfile linter
"aqua:yannh/kubeconform" = "0.8.0"            # Kubernetes manifest validation
"aqua:google/yamlfmt" = "0.21.0"              # YAML/values formatting outside this repo

# Go helpers, built with the pinned Go toolchain like gopls/goimports above.
"go:github.com/fatih/gomodifytags" = { version = "1.17.0", depends = ["go"] }
"go:github.com/josharian/impl" = { version = "1.5.0", depends = ["go"] }

# YAML, JSON and basedpyright need Node; the first two have no static language
# server, and basedpyright is the type-aware half of the Python LSP setup.
"node" = "24.20.0"
"npm:yaml-language-server" = { version = "1.24.0", depends = ["node"] }
"npm:vscode-langservers-extracted" = { version = "4.10.0", depends = ["node"] }
"npm:basedpyright" = { version = "1.39.10", depends = ["node"] }
