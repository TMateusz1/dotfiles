[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox"]
# Install explicitly with --locked; inspection tasks must not install tools.
task.run_auto_install = false

[tools]
# Shared defaults for Neovim and the shell. Projects may override these pins
# in their own mise.toml using the same fully qualified tool keys.

# Terminal apps
"aqua:neovim/neovim" = "0.12.5"         # Editor
"aqua:tmux/tmux-builds" = "3.7c"        # Terminal multiplexer
"aqua:ClementTsang/bottom" = "0.14.9"   # System monitor (btm)
"aqua:charmbracelet/glow" = "3.0.0"     # Markdown renderer
"aqua:jesseduffield/lazygit" = "0.65.1" # Git TUI
"aqua:derailed/k9s" = "0.51.0"          # Kubernetes TUI
"aqua:sxyazi/yazi" = "26.9.1"           # File manager

# Language runtimes and toolchains
"core:python" = "3.14.7" # Python runtime
"core:node" = "26.10.0"  # Node.js runtime for language servers
"core:go" = "1.27.1"     # Go toolchain
"core:rust" = "1.98.1"   # Rust toolchain

# Go
"go:golang.org/x/tools/gopls" = { version = "0.23.0", depends = ["go"] }         # Language server
"go:golang.org/x/tools/cmd/goimports" = { version = "0.50.0", depends = ["go"] } # Formatter/import organizer
"aqua:mvdan/gofumpt" = "0.12.0"                                                  # Stricter gofmt
"aqua:golangci/golangci-lint" = "2.13.2"                                         # Go meta-linter
"go:github.com/fatih/gomodifytags" = { version = "1.17.0", depends = ["go"] }    # Struct-tag editor
"go:github.com/josharian/impl" = { version = "1.5.0", depends = ["go"] }         # Interface stub generator
"aqua:gotestyourself/gotestsum" = "1.13.0"                                       # Go test runner

# Rust (the toolchain above also builds blink.cmp)
"aqua:rust-lang/rust-analyzer" = "2026-09-21" # Language server

# Python and Robot Framework
"aqua:astral-sh/uv" = "0.12.18"                                                                                                                                                                                                     # Package manager
"npm:basedpyright" = { version = "1.40.1", depends = ["node"] }                                                                                                                                                                     # Type checker and language server
"aqua:astral-sh/ruff" = "0.16.8"                                                                                                                                                                                                    # Linter, formatter, and language server
"pipx:mypy" = { version = "2.3.1", uvx_args = "--python 3.14.7", depends = ["python", "aqua:astral-sh/uv"] }                                                                                                                        # Type checker
"pipx:robotcode" = { version = "2.7.0", extras = ["languageserver", "analyze", "lint"], uvx_args = "--python 3.14.7 --with robotframework==7.3.2 --with robotframework-robocop==9.0.0", depends = ["python", "aqua:astral-sh/uv"] } # Robot Framework language server and tools
"pipx:robotframework" = { version = "7.5", uvx_args = "--python 3.14.7", depends = ["python", "aqua:astral-sh/uv"] }
"pipx:robotframework-robocop" = { version = "9.0.0", uvx_args = "--python 3.14.7 --with robotframework==7.3.2", depends = ["python", "aqua:astral-sh/uv"] }                                                                         # Robot Framework linter

# Lua
"aqua:LuaLS/lua-language-server" = "3.19.1" # Language server
"aqua:JohnnyMorganz/StyLua" = "2.5.2"       # Lua formatter

# JSON, HTML, and CSS
"npm:vscode-langservers-extracted" = { version = "4.10.0", depends = ["node"] } # JSON/HTML/CSS language servers
"aqua:jqlang/jq" = "1.8.2"                                                      # JSON processor

# YAML, Helm, and Kubernetes
"npm:yaml-language-server" = { version = "1.24.0", depends = ["node"] } # YAML language server
"aqua:google/yamlfmt" = "0.21.0"                                        # YAML formatter
"aqua:mrjosh/helm-ls" = "0.5.4"                                         # Helm language server
"aqua:yannh/kubeconform" = "0.8.0"                                      # Kubernetes schema validator
"aqua:helm/helm" = "4.3.0"                                              # Kubernetes package manager
"aqua:kubernetes-sigs/kind" = "0.33.0"                                  # Local Kubernetes clusters

# TOML
"aqua:tamasfe/taplo" = "0.10.0" # TOML formatter

# Shell
"aqua:mvdan/sh" = "3.14.1" # Shell formatter (shfmt)

# Dockerfile
"aqua:hadolint/hadolint" = "2.15.1" # Dockerfile linter

# Protocol Buffers
"aqua:bufbuild/buf" = "1.73.0" # Language server, formatter, and linter

# Shared editor infrastructure
"aqua:tree-sitter/tree-sitter" = "0.27.0" # Treesitter parser compiler

# Shared CLI tools (also used by editor pickers and git integrations)
"aqua:atuinsh/atuin" = "18.23.0"                         # Shell history search
"aqua:sharkdp/bat" = "0.26.1"                            # Syntax-highlighted cat
"aqua:dandavison/delta" = "0.19.2"                       # Git diff pager
"cargo:eza" = { version = "0.23.5", depends = ["rust"] } # Modern ls replacement
"aqua:sharkdp/fd" = "10.5.0"                             # Fast find replacement
"aqua:junegunn/fzf" = "0.74.4"                           # Fuzzy finder
"aqua:cli/cli" = "2.101.0"                               # GitHub CLI
"gitlab:gitlab-org/cli" = "1.119.0"                      # GitLab CLI
"aqua:BurntSushi/ripgrep" = "15.2.0"                     # Recursive text search
"aqua:starship/starship" = "1.26.0"                      # Shell prompt
"aqua:mikefarah/yq" = "4.53.6"                           # YAML processor
"aqua:ajeetdsouza/zoxide" = "0.10.0"                     # Directory jumper

[tasks."global:tools:status"]
description = "Show active tool versions and mise installation diagnostics"
dir = "{{cwd}}"
run = ["mise ls --current", "mise doctor"]

[tasks."global:tools:outdated"]
description = "Check active tools for newer releases without changing pins"
dir = "{{cwd}}"
run = "mise outdated --bump"
