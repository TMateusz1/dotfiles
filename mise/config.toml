[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox"]

[tools]
"aqua:dandavison/delta" = "0.19.2"
"aqua:atuinsh/atuin" = "18.20.1"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:jesseduffield/lazygit" = "0.64.1"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"rust" = "1.98.0"
"cargo:eza" = { version = "0.23.5", depends = ["rust"] }
"aqua:sharkdp/fd" = "10.5.0"
"aqua:junegunn/fzf" = "0.74.3"
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"go" = "1.27.0"
"aqua:golangci/golangci-lint" = "2.13.2"
"go:golang.org/x/tools/gopls" = { version = "0.23.0", depends = ["go"] }
"go:golang.org/x/tools/cmd/goimports" = { version = "0.49.0", depends = ["go"] }
"aqua:mvdan/gofumpt" = "0.11.0"
"aqua:gotestyourself/gotestsum" = "1.13.0"
"aqua:starship/starship" = "1.26.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:charmbracelet/glow" = "3.0.0"
"aqua:ClementTsang/bottom" = "0.14.9"
"aqua:sxyazi/yazi" = "26.8.15"
"aqua:cli/cli" = "2.98.0"
"gitlab:gitlab-org/cli" = "1.115.0"
"aqua:neovim/neovim" = "0.12.5"
# Required by nvim-treesitter's main branch to compile parsers — and it must
# not be the npm build (see docs/nvim.md). This aqua entry is a static binary.
"aqua:tree-sitter/tree-sitter" = "0.26.13"
