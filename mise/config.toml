[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox"]

[tools]
# Editor runtime and parser compiler
"aqua:neovim/neovim" = "0.12.5"            # Neovim editor
"aqua:tmux/tmux-builds" = "3.7c"           # Terminal multiplexer
"aqua:tree-sitter/tree-sitter" = "0.26.13" # Treesitter parser compiler

# Everyday CLI tools
"aqua:atuinsh/atuin" = "18.20.1" # Shell history search
"aqua:sharkdp/bat" = "0.26.1" # Syntax-highlighted cat
"aqua:ClementTsang/bottom" = "0.14.9" # System monitor (btm)
"npm:@openai/codex" = { version = "0.151.0", depends = [
  "node",
] } # OpenAI coding agent
"aqua:dandavison/delta" = "0.19.2" # Git diff pager
"cargo:eza" = { version = "0.23.5", depends = ["rust"] } # Modern ls replacement
"aqua:sharkdp/fd" = "10.5.0" # Fast find replacement
"aqua:junegunn/fzf" = "0.74.3" # Fuzzy finder
"aqua:cli/cli" = "2.98.0" # GitHub CLI
"gitlab:gitlab-org/cli" = "1.115.0" # GitLab CLI
"aqua:charmbracelet/glow" = "3.0.0" # Markdown renderer
"aqua:jqlang/jq" = "1.8.2" # JSON processor
"aqua:jesseduffield/lazygit" = "0.64.1" # Git TUI
"aqua:BurntSushi/ripgrep" = "15.2.0" # Recursive text search
"aqua:starship/starship" = "1.26.0" # Shell prompt
"aqua:google/yamlfmt" = "0.21.0" # YAML formatter
"aqua:sxyazi/yazi" = "26.8.15" # File manager
"aqua:mikefarah/yq" = "4.53.6" # YAML processor
"aqua:ajeetdsouza/zoxide" = "0.10.0" # Directory jumper

# Containers and Kubernetes
"aqua:abiosoft/colima" = "0.10.3"      # Local container runtime
"aqua:docker/cli" = "29.7.2"           # Docker command-line client
"aqua:hadolint/hadolint" = "2.15.1"    # Dockerfile linter
"aqua:helm/helm" = "4.2.4"             # Kubernetes package manager
"aqua:mrjosh/helm-ls" = "0.5.4"        # Helm language server
"aqua:derailed/k9s" = "0.51.0"         # Kubernetes TUI
"aqua:kubernetes-sigs/kind" = "0.33.0" # Local Kubernetes clusters
"aqua:yannh/kubeconform" = "0.8.0"     # Kubernetes schema validator

# Go
"core:go" = "1.27.0" # Go toolchain
"aqua:mvdan/gofumpt" = "0.11.0" # Stricter gofmt
"aqua:golangci/golangci-lint" = "2.13.2" # Go meta-linter
"go:golang.org/x/tools/cmd/goimports" = { version = "0.49.0", depends = [
  "go",
] } # Go formatter/import organizer
"go:github.com/fatih/gomodifytags" = { version = "1.17.0", depends = [
  "go",
] } # Struct-tag editor
"go:golang.org/x/tools/gopls" = { version = "0.23.0", depends = [
  "go",
] } # Go language server
"aqua:gotestyourself/gotestsum" = "1.13.0" # Go test runner
"go:github.com/josharian/impl" = { version = "1.5.0", depends = [
  "go",
] } # Interface stub generator

# Python
"core:python" = "3.14.7" # Python runtime
"aqua:astral-sh/uv" = "0.12.7" # Python package manager
"npm:basedpyright" = { version = "1.39.10", depends = [
  "node",
] } # Python type checker/language server
"pipx:mypy" = { version = "2.3.1", uvx_args = "--python 3.14.7", depends = [
  "python",
  "aqua:astral-sh/uv",
] }
"pipx:robotcode" = { version = "2.7.0", extras = [
  "languageserver",
  "analyze",
  "lint",
], uvx_args = "--python 3.14.7 --with robotframework==7.3.2 --with robotframework-robocop==9.0.0", depends = [
  "python",
  "aqua:astral-sh/uv",
] }
"pipx:robotframework" = { version = "7.3.2", uvx_args = "--python 3.14.7", depends = [
  "python",
  "aqua:astral-sh/uv",
] }
"pipx:robotframework-robocop" = { version = "9.0.0", uvx_args = "--python 3.14.7 --with robotframework==7.3.2", depends = [
  "python",
  "aqua:astral-sh/uv",
] }
"aqua:astral-sh/ruff" = "0.16.5" # Python linter, formatter, and language server

# Node.js
"core:node" = "24.20.0" # Node.js runtime for Codex and language servers

# Other language servers
"aqua:LuaLS/lua-language-server" = "3.19.1" # Lua language server
"npm:vscode-langservers-extracted" = { version = "4.10.0", depends = [
  "node",
] } # JSON/HTML/CSS language servers
"npm:yaml-language-server" = { version = "1.24.0", depends = [
  "node",
] } # YAML language server

# Rust
"core:rust" = "1.98.0"                        # Rust toolchain
"aqua:rust-lang/rust-analyzer" = "2026-08-24" # Rust language server
