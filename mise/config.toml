min_version = "2026.11.1"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox"]
# Setup installs tools explicitly using the committed lockfile.
task.run_auto_install = false

[tools]
# Runtimes and shared shell tools.
# Projects may override pins in their own mise.toml using the same tool keys.

# Terminal apps
"aqua:neovim/neovim" = "0.12.6"         # Terminal editor (binary only)
"aqua:zellij-org/zellij" = "0.45.1"     # Terminal workspace
"aqua:ClementTsang/bottom" = "0.15.0"   # System monitor (btm)
"aqua:jesseduffield/lazygit" = "0.66.2" # Git TUI
"aqua:derailed/k9s" = "0.51.0"          # Kubernetes TUI

# Python package management
"aqua:astral-sh/uv" = "0.13.7" # Package manager

# JSON CLI
"aqua:jqlang/jq" = "1.8.2" # JSON processor

# YAML, Helm, and Kubernetes
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2" # Kubernetes CLI
"aqua:helm/helm" = "4.3.1"                      # Kubernetes package manager
"aqua:kubernetes-sigs/kind" = "0.33.0"          # Local Kubernetes clusters

# Shared CLI tools
"aqua:sharkdp/bat" = "0.26.1"                            # Syntax-highlighted cat
"aqua:dandavison/delta" = "0.20.1"                       # Git diff pager
"cargo:eza" = { version = "0.23.5", depends = ["rust"] } # Modern ls replacement
"aqua:sharkdp/fd" = "10.5.1"                             # Fast find replacement
"aqua:junegunn/fzf" = "0.74.5"                           # Fuzzy finder
"aqua:cli/cli" = "2.103.3"                               # GitHub CLI
"gitlab:gitlab-org/cli" = "1.128.0"                      # GitLab CLI
"aqua:BurntSushi/ripgrep" = "15.2.0"                     # Recursive text search
"aqua:starship/starship" = "1.27.0"                      # Shell prompt
"aqua:mikefarah/yq" = "4.54.1"                           # YAML processor
"aqua:ajeetdsouza/zoxide" = "0.10.0"                     # Directory jumper

# Language runtimes and toolchains
python = "3.15.2" # Python runtime
node = "26.13.0"  # Node.js runtime
go = "1.27.3"     # Go toolchain
rust = "1.99.1"   # Rust toolchain

[tasks."global:setup"]
description = "Install global tools using the committed lockfile"
dir = "{{xdg_config_home}}/mise"
run = "mise install --locked"

[tasks."global:update"]
description = "Upgrade global tools and refresh config pins and lockfiles"
dir = "{{xdg_config_home}}/mise"
run = [
  "mise upgrade --global --bump --pin",
  "mise lock --global",
  "mise run global:setup",
]
