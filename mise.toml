[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
disable_backends = ["asdf", "vfox"]
# Relative dotfile sources below resolve against this file's own directory
# (the repo root), not against dotfiles.root — so dotfiles.root is
# deliberately left unset. See docs/bootstrap.md.
dotfiles.default_mode = "symlink"

[env]
HK_MISE = 1
MISE_NPM_PACKAGE_MANAGER = "npm"

[tools]
"core:node" = "24"
"npm:@openai/codex" = { version = "0.151.0", depends = ["node"] }
"aqua:anthropics/claude-code" = "2.1.251"
"aqua:jdx/hk" = "1.56.1"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:rvben/rumdl" = "0.2.62"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:JohnnyMorganz/StyLua" = "2.5.2"

[hooks]
# keeps the installed git hooks (hk.pkl) in sync whenever tools are (re)installed
postinstall = "hk install --mise"

[tasks.pre-commit]
description = "Run hk's pre-commit checks (mirrors the installed git hook)"
run = "hk run pre-commit"

# Bootstrap tasks — see docs/bootstrap.md. None of these run automatically
# (not on `mise install`, not via any hook); run them explicitly, from the
# repo root, when you're ready to apply this repo to a machine.
[tasks."bootstrap:status"]
description = "Show what bootstrap would change, without applying anything"
run = ["mise bootstrap dotfiles status", "mise bootstrap repos status"]

[tasks."bootstrap:dry-run"]
description = "Preview the dotfile symlinks bootstrap would create, without creating them"
run = "mise bootstrap dotfiles apply --dry-run"

[tasks."bootstrap:dotfiles"]
description = "Symlink this repo's configs into place"
run = "mise bootstrap dotfiles apply"

[tasks."bootstrap:zsh-plugins"]
description = "Clone/update oh-my-zsh and its custom plugins"
run = "mise bootstrap repos apply"

[tasks."bootstrap:zsh-completion"]
description = "Install mise's generated Zsh completion"
run = "mise completion zsh --install"

[tasks."bootstrap:all"]
description = "Bootstrap dotfiles, Zsh plugins, and mise's Zsh completion"
depends = [
  "bootstrap:dotfiles",
  "bootstrap:zsh-plugins",
  "bootstrap:zsh-completion",
]

# Desktop/GUI apps live in mise/config.desktop.toml, loaded only via `-E desktop` —
# never by plain `mise install`/`mise bootstrap`/`mise run`. This is the
# only task that reaches it.
[tasks."bootstrap:all-desktop"]
description = "Bootstrap a desktop machine and install GUI/desktop apps (kitty, fonts, ...) — opt-in, not part of bootstrap:all"
depends = ["bootstrap:all"]
run = "mise -E desktop bootstrap packages apply"

[dotfiles]
"~/.zshrc" = "shell/.zshrc"
"~/.tmux.conf" = "tmux/.tmux.conf"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/git" = "git"
"~/.config/atuin" = "atuin"
"~/.config/bat" = "bat"
"~/.config/eza" = "eza"
"~/.config/fzf" = "fzf"
"~/.config/ripgrep" = "ripgrep"
"~/.config/lazygit" = "lazygit"
"~/.config/k9s" = "k9s"
"~/.config/kitty" = "kitty"
"~/.config/bottom" = "bottom"
"~/.config/yazi" = "yazi"
"~/.config/nvim" = "nvim"
# glow is symlinked file-by-file, not as a whole directory: glow auto-creates
# and rewrites its own `glow.yml` in this directory, which — with a directory
# symlink — means it writes into this git repo. Only the theme is managed
# here; glow.yml stays machine-local. See docs/util_tools.md#glow.
"~/.config/glow/glamour.json" = "glow/glamour.json"
# Every global mise config layer and its matching lockfile must reach the
# machine, along with the early setting that enables automatic platform layers.
# See docs/mise.md.
"~/.config/mise/config.toml" = "mise/config.toml"
"~/.config/mise/mise.lock" = "mise/mise.lock"
"~/.config/mise/config.macos.toml" = "mise/config.macos.toml"
"~/.config/mise/mise.macos.lock" = "mise/mise.macos.lock"
"~/.config/mise/config.desktop.toml" = "mise/config.desktop.toml"
"~/.config/mise/miserc.toml" = "mise/miserc.toml"

[bootstrap.repos]
# oh-my-zsh has no tagged releases (it's designed to track master via its
# own self-update); the three plugins below are pinned to real tags.
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", ref = "master" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "v0.7.1" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "0.8.0" }
"~/.oh-my-zsh/custom/plugins/you-should-use" = { url = "https://github.com/MichaelAquilina/zsh-you-should-use.git", ref = "1.11.1" }
