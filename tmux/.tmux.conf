# ~/.tmux.conf

# ------------------------------------------------------------
# Prefix
# ------------------------------------------------------------

set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ------------------------------------------------------------
# Terminal / colors
# ------------------------------------------------------------

# Use tmux terminfo inside tmux.
# Avoid setting a terminal-specific TERM (e.g. xterm-kitty) explicitly here,
# because it can break SSH/Linux hosts when remote systems do not know that
# terminal type.
set -g default-terminal "tmux-256color"

# Fixed array slots keep tmux's defaults and avoid duplicates on every reload.
# Slots 10-12 belong to this config; tmux's built-in entries use lower slots.
set -s terminal-overrides[10] "xterm*:Tc"
set -s terminal-overrides[11] "xterm-256color:RGB"
set -s terminal-overrides[12] '*:Ms=\E]52;%p1%s;%p2%s\007'

# Forward modified keys such as Shift-Enter to TUI apps when supported by the
# installed tmux version.
set -sq extended-keys always
set -sq extended-keys-format csi-u

# Pass terminal focus events through to applications. Neovim relies on
# FocusGained to reload files changed on disk (lazygit popup, go generate).
set -g focus-events on

# Let Neovim's 'title' option set the terminal window title through tmux.
set -g set-titles on
set -g set-titles-string "#T"

# Let OSC52 clipboard requests/responses pass between remote apps and the
# local terminal. This is needed for remote Neovim paste from the macOS
# clipboard with `p`, not only copy with `y`.
set -gq allow-passthrough on

# ------------------------------------------------------------
# Clipboard / mouse / history
# ------------------------------------------------------------

set -s set-clipboard on
set -s terminal-features[10] 'xterm-kitty:clipboard:extkeys'
set -s terminal-features[11] 'xterm-256color:clipboard'
set -s terminal-features[12] 'tmux-256color:clipboard'

set -g mouse on
set -g history-limit 100000

# tmux 3.7c can misparse a split OSC 52 clipboard reply as keyboard input when
# escape-time is very short. 100 ms mitigates that upstream bug without making
# Escape/Meta handling noticeably sluggish; revisit after tmux/tmux#5388 lands
# in a stable release.
set -sg escape-time 100

# ------------------------------------------------------------
# Indexing
# ------------------------------------------------------------

set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------
# Splits / windows
# ------------------------------------------------------------

# Split in current pane directory
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current pane directory
bind c new-window -c "#{pane_current_path}"

# Session and title management
bind C command-prompt -p "New session name" "new-session -s '%%' -c '#{pane_current_path}'"
bind S command-prompt -I "#S" -p "Rename session" "rename-session '%%'"
bind W command-prompt -I "#W" -p "Rename window" "rename-window '%%'"
bind T command-prompt -I "#{pane_title}" -p "Rename pane" "select-pane -T '%%'"

# SessionX replaces the native session picker (loaded at the end).
set -g @sessionx-bind s
set -g @sessionx-fzf-builtin-tmux on
# Keep every session selectable, including the current one.
set -g @sessionx-filter-current false
# Keep the existing Catppuccin fzf colors instead of SessionX's defaults.
set -g @sessionx-additional-options '--color=pointer:#89b4fa,spinner:#89b4fa,marker:#a6e3a1'

# Capture the current session before choose-tree evaluates its per-item filter.
# run-shell -C runs a native tmux command; ## keeps the item-side format literal.
bind w run-shell -C "choose-tree -Zw -f '##{==:##{session_id},#{session_id}}'"

# Roll between windows: press prefix once, then [ / ] repeatedly.
# Keep Ctrl variants too; legacy Ctrl-[ arrives as Escape in some terminals.
set -g repeat-time 1000
bind -r [ previous-window
bind -r ] next-window
bind -r C-[ previous-window
bind -r C-] next-window
bind -r Escape previous-window

# Brackets replace the stock copy/paste keys. Prefix PageUp still opens
# scrollback; uppercase P pastes the tmux buffer.
bind P paste-buffer -p

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ------------------------------------------------------------
# Smart pane switching with Neovim awareness
# ------------------------------------------------------------

# If current pane is running Vim/Neovim/fzf, send pane-navigation keys to it.
# Otherwise, move between tmux panes. At an outside edge, emit a Kitty user
# variable through the client terminal. A narrowly scoped Kitty watcher turns
# it into outer-split navigation; unlike a local control socket, this survives
# SSH to a tmux server on another machine.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# These command aliases write a tmux passthrough sequence to the active pane's
# tty. The OSC 1337 value is base64, as required by Kitty's SetUserVar protocol.
set -s command-alias[100] "kitty-nav-left=run-shell \"printf '\\033Ptmux;\\033\\033]1337;SetUserVar=tmux_kitty_navigate=bGVmdA==\\007\\033\\\\' > '#{pane_tty}'\""
set -s command-alias[101] "kitty-nav-bottom=run-shell \"printf '\\033Ptmux;\\033\\033]1337;SetUserVar=tmux_kitty_navigate=Ym90dG9t\\007\\033\\\\' > '#{pane_tty}'\""
set -s command-alias[102] "kitty-nav-top=run-shell \"printf '\\033Ptmux;\\033\\033]1337;SetUserVar=tmux_kitty_navigate=dG9w\\007\\033\\\\' > '#{pane_tty}'\""
set -s command-alias[103] "kitty-nav-right=run-shell \"printf '\\033Ptmux;\\033\\033]1337;SetUserVar=tmux_kitty_navigate=cmlnaHQ=\\007\\033\\\\' > '#{pane_tty}'\""

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "if-shell -F '#{pane_at_left}' 'kitty-nav-left' 'select-pane -L'"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "if-shell -F '#{pane_at_bottom}' 'kitty-nav-bottom' 'select-pane -D'"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "if-shell -F '#{pane_at_top}' 'kitty-nav-top' 'select-pane -U'"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "if-shell -F '#{pane_at_right}' 'kitty-nav-right' 'select-pane -R'"
bind-key -n C-Left if-shell "$is_vim" "send-keys C-Left" "if-shell -F '#{pane_at_left}' 'kitty-nav-left' 'select-pane -L'"
bind-key -n C-Down if-shell "$is_vim" "send-keys C-Down" "if-shell -F '#{pane_at_bottom}' 'kitty-nav-bottom' 'select-pane -D'"
bind-key -n C-Up if-shell "$is_vim" "send-keys C-Up" "if-shell -F '#{pane_at_top}' 'kitty-nav-top' 'select-pane -U'"
bind-key -n C-Right if-shell "$is_vim" "send-keys C-Right" "if-shell -F '#{pane_at_right}' 'kitty-nav-right' 'select-pane -R'"

# Jump back to the previously used pane. vim-tmux-navigator maps C-\ to
# TmuxNavigatePrevious on the Neovim side; this is the tmux half, so the key
# behaves the same whether or not the current pane is running Neovim.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# LazyGit popup in current directory
bind -r g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E lazygit

# ------------------------------------------------------------
# Copy mode
# ------------------------------------------------------------

setw -g mode-keys vi
set -g status-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi C-h if-shell -F '#{pane_at_left}' 'kitty-nav-left' 'select-pane -L'
bind-key -T copy-mode-vi C-j if-shell -F '#{pane_at_bottom}' 'kitty-nav-bottom' 'select-pane -D'
bind-key -T copy-mode-vi C-k if-shell -F '#{pane_at_top}' 'kitty-nav-top' 'select-pane -U'
bind-key -T copy-mode-vi C-l if-shell -F '#{pane_at_right}' 'kitty-nav-right' 'select-pane -R'
bind-key -T copy-mode-vi C-Left if-shell -F '#{pane_at_left}' 'kitty-nav-left' 'select-pane -L'
bind-key -T copy-mode-vi C-Down if-shell -F '#{pane_at_bottom}' 'kitty-nav-bottom' 'select-pane -D'
bind-key -T copy-mode-vi C-Up if-shell -F '#{pane_at_top}' 'kitty-nav-top' 'select-pane -U'
bind-key -T copy-mode-vi C-Right if-shell -F '#{pane_at_right}' 'kitty-nav-right' 'select-pane -R'

# ------------------------------------------------------------
# Statusline - Catppuccin Mocha, styled after the lualine setup
# ------------------------------------------------------------

# Mocha palette. Static styles use these via -gF; the format strings below
# inline the hex values because -gF would also expand runtime conditionals at
# load time.
set -g @ctp_base "#1e1e2e"
set -g @ctp_crust "#11111b"
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"
set -g @ctp_surface2 "#585b70"
set -g @ctp_text "#cdd6f4"
set -g @ctp_blue "#89b4fa"
set -g @ctp_peach "#fab387"
set -g @ctp_yellow "#f9e2af"

set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 130

set -gF status-style "bg=#{@ctp_base},fg=#{@ctp_text}"

# Session block: blue accent, peach while the prefix is active so there's
# visible feedback after C-b. Square edges match the other status bars.
set -g status-left "#[fg=#11111b,bg=#{?client_prefix,#fab387,#89b4fa},bold] #S #[default] "

# Right side: current pane directory and Git branch, host resource usage,
# and Warsaw time/date. Branch icon/color match Starship; q quotes the path
# for the shell. TZ is scoped to the clock command only.
set -g status-right "#[fg=#a6adc8]󰉋 #{b:pane_current_path} #[fg=#fab387]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null | sed 's/^/ /')  #[fg=#11111b,bg=#a6e3a1,bold] #(sh ~/.config/tmux/status-metrics.sh) #[fg=#11111b,bg=#89b4fa,bold] 󰥔 #(TZ=Europe/Warsaw date '+%%H:%%M  %%d/%%m/%%Y') #[default]"

# Windows: dim inactive, current one outlined in white (same bg as the bar),
# zoom indicator when a pane is zoomed.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e]  #I #W#{?window_zoomed_flag, 󰍉,} "
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#1e1e2e]#[bold]#I #W#{?window_zoomed_flag, 󰍉,}#[nobold]#[default]"

# Flag windows with activity instead of popping a message.
setw -g monitor-activity on
set -g visual-activity off
setw -gF window-status-activity-style "fg=#{@ctp_yellow},bg=#{@ctp_base}"

# Panes keep the default terminal background (kitty translucency applies
# everywhere); the active pane is marked by a blue border instead.
set -g pane-border-lines single
set -g pane-border-indicators colour
set -gF pane-border-style "fg=#{@ctp_surface0}"
set -gF pane-active-border-style "fg=#{@ctp_blue}"

set -g pane-border-status off

# Popups use rounded borders like nvim's floating windows.
set -g popup-border-lines rounded
set -gF popup-border-style "fg=#{@ctp_blue}"
set -gF popup-style "bg=#{@ctp_base}"

# Pane number overlay (prefix q).
set -gF display-panes-colour "#{@ctp_surface2}"
set -gF display-panes-active-colour "#{@ctp_blue}"
set -gF message-style "fg=#{@ctp_text},bg=#{@ctp_surface0}"
set -gF message-command-style "fg=#{@ctp_text},bg=#{@ctp_surface0}"
set -gF mode-style "fg=#{@ctp_text},bg=#{@ctp_surface1}"
set -gF copy-mode-match-style "fg=#{@ctp_crust},bg=#{@ctp_yellow}"
set -gF copy-mode-current-match-style "fg=#{@ctp_crust},bg=#{@ctp_peach}"
set -gF clock-mode-colour "#{@ctp_blue}"

# ------------------------------------------------------------
# Sessions: save/restore and plugin loading
# ------------------------------------------------------------

# Saves stay machine-local, outside the public dotfiles repository.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-save-interval 15
set -g @continuum-restore on

# mise bootstrap provisions pinned plugin checkouts; no TPM is needed.
# Continuum must load after Resurrect and after status-right is configured.
run-shell '~/.local/share/tmux/plugins/tmux-sessionx/sessionx.tmux'
run-shell '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'
# This upstream revision enables Bash tracing; keep it out of the pane.
run-shell '~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux 2>~/.local/share/tmux/plugins/tmux-continuum.log'
