# ~/.config/lazygit/config.yml
#
# Theme values are the official catppuccin/lazygit Mocha "blue" variant
# (https://github.com/catppuccin/lazygit/blob/main/themes/mocha/blue.yml),
# matching the blue accent used everywhere else in this repo (delta, atuin,
# tmux) — see AGENTS.md's "prefer the official Catppuccin port" rule.

git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"
