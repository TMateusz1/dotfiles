include catppuccin-mocha.conf

env read_from_shell=PATH EDITOR VISUAL
# Follow VISUAL/EDITOR from the shell.
editor .

#font_family JetBrainsMono Nerd Font
font_family GeistMono Nerd Font Mono
font_size 16.0

modify_font cell_height 105%

# Keep terminal text contrast consistent across shell output and TUI apps.
background_opacity 1.0

window_padding_width 3 6
hide_window_decorations no
macos_titlebar_color #1e1e2e

cursor_shape block
cursor_blink_interval 0.5

enable_audio_bell no
confirm_os_window_close 0
# Left Option sends Alt shortcuts; right Option keeps native character input.
# Changing this setting requires restarting Kitty.
macos_option_as_alt left
# Seamless remote paste requires clipboard reads. This deliberately lets any
# program reached through the terminal (including over SSH) read the macOS
# clipboard without a prompt; use read-clipboard-ask instead to trade ordinary
# unattended reads for per-read confirmation.
clipboard_control write-clipboard write-primary read-clipboard read-primary

tab_bar_edge bottom
tab_bar_min_tabs 2
tab_title_template [{index}] {title}
active_tab_title_template [{index}] {title}

# Pass these through to Zellij instead of switching Kitty tabs or windows.
map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+[ no_op
map ctrl+shift+] no_op

# Zellij's session manager hardcodes Delete. Add a Mac-friendly equivalent
# only while that plugin owns the terminal title; keep Delete available too.
# Use \s: literal spaces would split Kitty's window-match query.
map --when-focus-on 'title:[|]\sSession\sManager$' ctrl+backspace send_key delete

# Prevent Hyper-D from degrading into Ctrl-D/EOT in terminal apps.
map ctrl+shift+alt+cmd+d discard_event

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

map f5 launch --location=hsplit
map f6 launch --location=vsplit

map shift+enter send_text all \e[13;2u
map alt+enter send_text all \e[13;3u
map ctrl+enter send_text all \e[13;5u
map ctrl+shift+enter send_text all \e[13;6u
