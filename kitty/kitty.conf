include catppuccin-mocha.conf

env read_from_shell=PATH EDITOR VISUAL
editor nvim

#font_family JetBrainsMono Nerd Font
font_family GeistMono Nerd Font Mono
font_size 16.0

modify_font cell_height 105%

# Keep this opaque: translucency composites the desktop into the background so
# real text contrast drifts, while cells with an explicit
# background (Neovim, the tmux status bar) stayed opaque while plain shell
# output did not.
background_opacity 1.0

window_padding_width 3 6
hide_window_decorations no
macos_titlebar_color #1e1e2e

cursor_shape block
cursor_blink_interval 0.5

enable_audio_bell no
confirm_os_window_close 0
macos_option_as_alt no
# Seamless remote paste requires clipboard reads. This deliberately lets any
# program reached through the terminal (including over SSH) read the macOS
# clipboard without a prompt; use read-clipboard-ask instead to trade ordinary
# Neovim `p` for per-read confirmation.
clipboard_control write-clipboard write-primary read-clipboard read-primary

tab_bar_edge bottom
tab_bar_min_tabs 2
tab_title_template [{index}] {title}
active_tab_title_template [{index}] {title}

# Ctrl-direction keys enter tmux/Neovim while they own the alternate screen;
# at their outer edge they send a narrow user-variable request back to this
# watcher. In an ordinary shell the same keys move directly between Kitty
# splits. The escape-sequence handoff also works through SSH.
watcher pane_navigation.py
map ctrl+h kitten pane_navigation.py left ctrl+h
map ctrl+j kitten pane_navigation.py bottom ctrl+j
map ctrl+k kitten pane_navigation.py top ctrl+k
map ctrl+l kitten pane_navigation.py right ctrl+l
map ctrl+left kitten pane_navigation.py left ctrl+left
map ctrl+down kitten pane_navigation.py bottom ctrl+down
map ctrl+up kitten pane_navigation.py top ctrl+up
map ctrl+right kitten pane_navigation.py right ctrl+right

# Prevent Hyper-D from degrading into Ctrl-D/EOT in terminal apps such as tmux.
map ctrl+shift+alt+cmd+d discard_event

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

map f5 launch --location=hsplit
map f6 launch --location=vsplit

map shift+enter send_text all \e[13;2u
map alt+enter send_text all \e[13;3u
map ctrl+enter send_text all \e[13;5u
map ctrl+shift+enter send_text all \e[13;6u
